openapi: 3.1.0
info:
  version: 0.1.0
  title: Dispose Me - Cloudflare
  description: |-
    Dispose Me - Cloudflare is a disposable email service with API capabilities.

    ### Authentication
    With private access enabled (the default), an API token is required for inbox endpoints. Users can provide the token in **one** of three ways:
      - HTTP Header: `x-api-key`
      - Query Parameter: `x-api-key`
      - Cookie: `x-api-key`
    Choose whichever method best suits your use case.
    Set `type=json` for JSON responses, including validation errors. HTML is the default view.
  contact:
    name: Dispose Me - Cloudflare Maintainers
    url: https://github.com/kdybicz/dispose-me-cf
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{hostname}
    variables:
      hostname:
        default: example.com
        description: Your domain

tags:
  - name: Inbox
    description: Inbox operations

paths:
  /inbox/{username}:
    get:
      summary: List emails in the inbox
      description: List all emails sent to the inbox for a given username.
      operationId: listInboxEmails
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
            minLength: 3
            maxLength: 25
        - name: type
          in: query
          description: Response output format.
          schema:
            type: string
            enum: ["json", "html"]
            default: "html"
        - name: sentAfter
          in: query
          description: Show only emails sent after this Unix epoch time (seconds).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Maximum number of messages to return.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 10
      responses:
        '200':
          description: Returns the list of emails in the inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailList'
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/{id}:
    get:
      summary: Show details of an email
      description: Returns the content of an email, including author, recipients, subject, body, and attachment information.
      operationId: getEmailDetails
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
        - name: id
          in: path
          description: Unique identifier for the email.
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Response output format.
          schema:
            type: string
            enum: ["json", "html"]
            default: "html"
      responses:
        '200':
          description: Returns email details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetails'
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/{id}/inline/{part}:
    get:
      summary: Load an inline raster image
      description: |
        Returns the original decoded MIME part bytes, after instance authentication,
        username validation, and unexpired inbox membership checks on every request.
        Supports image/png, image/jpeg, image/gif, image/webp, and image/avif only.
        SVG and other active formats are not served. No additional image byte-size
        or part-count cap is imposed; Workers memory/CPU and Email Routing limits
        still apply. Each resource request reparses the stored raw message.
        Responses use no-store, nosniff, inline disposition, sandbox CSP, and
        no-referrer. CORP permits embedding in the opaque-origin sandbox but does
        not bypass authentication or grant CORS access.
      operationId: getInlineImage
      tags: [Inbox]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: part
          in: path
          required: true
          description: Zero-based MIME attachment-array index returned in inlineParts.
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
      responses:
        '200':
          description: Decoded raster image bytes, never base64 JSON.
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
            image/avif: {}
        '403':
          description: Missing or invalid instance token.
        '404':
          description: Missing, deleted, expired, or non-member message; absent or unsupported part.
        '422':
          description: Invalid or reserved username, message ID, or part index.
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/{id}/attachment:
    get:
      summary: Download a specific attachment from an email
      description: |
        Download an attachment from the specified email.
        The `Content-Type` header will match the attachment's MIME type (e.g., `image/png`, `application/pdf`, etc.).
        The `Content-Disposition` header is set for proper file downloads.
      operationId: downloadEmailAttachment
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
        - name: id
          in: path
          description: Unique identifier for the email.
          required: true
          schema:
            type: string
        - name: filename
          in: query
          description: The filename of the attachment to download.
          required: true
          schema:
            type: string
            examples: ["image.png"]
      responses:
        '200':
          description: The attachment file data.
          headers:
            Content-Type:
              description: The MIME type of the file.
              schema:
                type: string
                examples: ["image/png"]
            Content-Disposition:
              description: Suggests a default filename for saving.
              schema:
                type: string
                examples: ['attachment; filename="image.png"']
          content:
            "*/*":
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Invalid email content or missing attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/{id}/delete:
    delete:
      summary: Delete a specific email
      description: Deletes the email with the specified ID from the inbox.
      operationId: deleteEmail
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
        - name: id
          in: path
          description: Unique identifier for the email.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Email successfully deleted. No content is returned.
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/{id}/download:
    get:
      summary: Download an email as an `.eml` file
      description: |
        Download the full email as a standard `.eml` file, preserving the stored MIME
        bytes exactly. After authentication and unexpired inbox membership checks,
        the R2 body is streamed with backpressure rather than buffered or parsed.
        Client disconnection cancels the stream. Workers controls transfer framing;
        Content-Length may be absent for streamed responses.
      operationId: downloadEmailAsEml
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
        - name: id
          in: path
          description: Unique identifier for the email.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The email content as an `.eml` file.
          headers:
            Content-Type:
              description: The MIME type of the file `application/octet-stream`.
              schema:
                type: string
                examples: ["application/octet-stream"]
            Content-Disposition:
              description: Suggests a default filename for saving.
              schema:
                type: string
                examples: ['attachment; filename="email.eml"']
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Invalid email content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

  /inbox/{username}/feed/:
    get:
      summary: Read the latest inbox messages as RSS
      description: |
        Includes the latest 10 unexpired messages in inbox order. Messages are
        loaded and parsed sequentially, retaining only feed items, not raw MIME or
        decoded attachments. Per-request limits are 25 MiB (26214400 bytes) of
        cumulative raw MIME reads, 1 MiB (1048576 bytes) of cumulative UTF-8 JSON
        serialized feed-item data, and 2 MiB (2097152 bytes) of UTF-8 RSS output.
        The raw read limit is checked against R2 object size before buffering each
        message. Exceeding any limit returns 413 for the whole feed; messages and
        bodies are never silently skipped or truncated. Use the inbox, message,
        and download endpoints for full content when the RSS budget is exceeded.
      operationId: getInboxFeed
      tags: [Inbox]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: x-api-key
          in: query
          required: true
          description: Instance access token; this route requires the query parameter.
          schema:
            type: string
            minLength: 20
            maxLength: 50
      responses:
        '200':
          description: Complete RSS feed for the latest 10 messages, or an empty feed.
          content:
            application/rss+xml:
              schema:
                type: string
        '403':
          description: Missing or invalid instance access token.
        '413':
          description: RSS resource budget exceeded. No partial feed is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or reserved username, or missing/invalid query token.
      security:
        - api_token_query: []

  /inbox/{username}/latest:
    get:
      summary: Show details of the latest email
      description: Returns the content of the latest email, including author, recipients, subject, body, and attachment information.
      operationId: getLatestEmail
      tags:
        - Inbox
      parameters:
        - name: username
          in: path
          description: The username associated with the disposable inbox.
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9.\-_+]*$
        - name: sentAfter
          in: query
          description: Show only the latest email if it was sent after this Unix epoch time (seconds).
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          description: Response output format.
          schema:
            type: string
            enum: ["json", "html"]
            default: "html"
      responses:
        '200':
          description: Returns the details of the latest email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetails'
        '403':
          description: Forbidden – Invalid or missing API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
        - api_token_header: []
        - api_token_query: []
        - api_token_cookie: []

components:
  schemas:
    EmailItem:
      type: object
      required:
        - id
        - from
        - subject
        - received
        - hasAttachments
      properties:
        id:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 identifier of the raw MIME message bytes.
          examples: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
        from:
          type: string
          description: Parsed sender address; may be empty when unavailable.
          examples: ["jane.doe@example.com"]
        subject:
          type: string
          description: Subject of the email.
          examples: ["Subject of the email"]
        received:
          type: string
          format: date-time
          description: Processing-time arrival timestamp used for inbox ordering and retention (RFC 3339 format).
        hasAttachments:
          type: boolean
          description: Indicates if the email has any attachments.
          examples: [false]
    EmailList:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          description: Array of email items in the inbox.
          items:
            $ref: '#/components/schemas/EmailItem'
    EmailAddress:
      type: object
      required:
        - address
        - user
        - host
      properties:
        address:
          type: string
          description: Parsed mailbox address (e.g., user@domain.com); may be empty when unavailable.
          examples: ["john.doe@example.com"]
        user:
          type: [string, "null"]
          description: Local part of the email address (before @).
          examples: ["john.doe"]
        host:
          type: [string, "null"]
          description: Domain part of the email address.
          examples: ["example.com"]
        displayName:
          type: string
          description: Display name of the sender or recipient.
          examples: ["John Doe"]
    Attachment:
      type: object
      required:
        - size
        - contentType
      properties:
        filename:
          type: string
          description: Name of the attachment file, when supplied in the MIME message.
          examples: ["image.png"]
        size:
          type: integer
          description: File size in bytes.
          examples: [1337]
        contentType:
          type: string
          description: MIME type of the attachment file.
          examples: ["image/png"]
    EmailDetails:
      type: object
      required:
        - from
        - to
        - cc
        - bcc
        - subject
        - body
        - received
        - attachments
        - inlineParts
        - id
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          type: array
          description: List of primary recipient email addresses.
          items:
            $ref: '#/components/schemas/EmailAddress'
        cc:
          type: array
          description: List of CC recipient email addresses.
          items:
            $ref: '#/components/schemas/EmailAddress'
        bcc:
          type: array
          description: List of BCC recipient email addresses.
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
          description: Subject of the email.
          examples: ["Subject of the email"]
        body:
          type: string
          description: Original parsed body, with unresolved cid URLs. Untrusted HTML; API consumers must isolate/sanitize it before display. The HTML viewer separately sanitizes and resolves supported CID images.
          examples: ["Body of the email"]
        received:
          type: string
          format: date-time
          description: Parsed MIME Date header, or the Unix epoch when absent or invalid (RFC 3339 format). Retention uses processing time instead.
        attachments:
          type: array
          description: List of attachments for the email.
          items:
            $ref: '#/components/schemas/Attachment'
        inlineParts:
          type: array
          description: |
            Non-attachment MIME parts plus supported raster-image attachments with a
            Content-ID. Bytes are omitted. CID-bearing raster-image attachments also
            remain in attachments and retain the existing download behavior. Other
            explicit attachments, including images without a Content-ID and active
            formats such as SVG, are not included in inlineParts.
            The HTML viewer matches case-sensitive Content-IDs after stripping angle
            brackets and percent-decoding cid references once. Duplicate IDs select
            the first supported image in MIME order; repeated references reuse its
            URL. Missing, malformed, or unsupported references render without a src.
            Unsupported parts remain visible in metadata and the raw MIME download.
          items:
            allOf:
              - $ref: '#/components/schemas/Attachment'
              - type: object
                required: [part]
                properties:
                  part:
                    type: integer
                    minimum: 0
                  contentId:
                    type: string
                    description: Content-ID without enclosing angle brackets; omitted if absent.
                  url:
                    type: string
                    description: Same-origin resource path for supported raster types; omitted otherwise. Contains no credentials. Authenticate the resource request separately.
        id:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 identifier of the raw MIME message bytes.
          examples: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message.
          examples: ["The page you are looking for was not found."]
    ValidationError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: List of validation errors.
          items:
            type: object
            required:
              - type
              - msg
              - path
              - location
            properties:
              type:
                type: string
                description: Type of error (e.g., "field").
                examples: ["field"]
              value:
                description: Invalid client value, which can be any JSON type and may be omitted for a missing field.
                examples: ["user^name"]
              msg:
                type: string
                description: Error message explaining the validation failure.
                examples: ["Username may only contain letters, numbers, dots (.), hyphens (-), underscores (_), and plus signs (+)."]
              path:
                type: string
                description: The name of the field that failed validation.
                examples: ["username"]
              location:
                type: string
                description: Location of the parameter (e.g., "params", "query").
                examples: ["params"]

  securitySchemes:
    api_token_header:
      type: apiKey
      name: x-api-key
      in: header
      description: API key to authorize requests, sent in HTTP header.
    api_token_query:
      type: apiKey
      name: x-api-key
      in: query
      description: API key to authorize requests, sent as a query parameter.
    api_token_cookie:
      type: apiKey
      name: x-api-key
      in: cookie
      description: API key to authorize requests, sent in a cookie.
